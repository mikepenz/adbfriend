# Thanks to https://github.com/coil-kt/coil/blob/master/.github/workflows/ci.yml
name: CI

on:
  push:
    tags:
      - '*'
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 100

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'zulu'
          java-version: |
            11
            17

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6

      - name: Copy CI gradle.properties
        run: mkdir -p ~/.gradle ; cp .github/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6

      - name: Update AboutLibs
        run: ./gradlew adbfriend-cli:exportLibraryDefinitions -PaboutLibraries.exportPath=src/main/composeResources/files/

      - name: Build CLI tool
        run: ./gradlew adbfriend-cli:shadowDistZip

      - name: Archive Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: "adbfriend-cli"
          path: adbfriend-cli/build/distributions/

      - name: Build Changelog
        id: github_release
        uses: mikepenz/release-changelog-builder-action@bcae7115752d4ed746ff92feb666574428a79415 # v6
        if: startsWith(github.ref, 'refs/tags/')
        with:
          configuration: ".github/config/configuration.json"
          ignorePreReleases: ${{ !contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build *.dxt
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          unzip adbfriend-cli/build/distributions/adbfriend-cli-shadow-${{ github.ref_name }}.zip
          sed 's/{{VERSION}}/${{ github.ref_name }}/g' manifest.json > adbfriend-cli-shadow-${{ github.ref_name }}/manifest.json
          npx @anthropic-ai/dxt pack adbfriend-cli-shadow-${{ github.ref_name }}

      - name: Release
        uses: mikepenz/action-gh-release@5c3d16ffbdc3e0fbfe2c8a69a448798f5d9b30c2 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: ${{steps.github_release.outputs.changelog}}
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-b') || contains(github.ref, '-a') }}
          files: |
            adbfriend-cli/build/distributions/*
            adbfriend-cli-shadow-${{ github.ref_name }}.dxt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Tap
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          SHA256="$(sha256sum "adbfriend-cli/build/distributions/adbfriend-cli-shadow-${{ github.ref_name }}.zip" | cut -d " " -f 1)"
          curl --retry 2 --connect-timeout 30 -X POST https://api.github.com/repos/mikepenz/homebrew-tap/dispatches -H 'Accept: applicatoin/vnd.github.everest-preview+json' -u ${{ secrets.TRIGGER_TOKEN }} --data '{"event_type": "update-tap", "client_payload": {"version":"${{ github.ref_name }}","sha":"'${SHA256}'"}}'
